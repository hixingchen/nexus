name: Release

# 发版：push 一个 v* tag → 在 windows runner 上打包 → 附到 GitHub Release（草稿）
#
# 为什么不并进 ci.yml：门禁只需要读代码（那里的"权限最小化"注释是刻意的），而发布必须写
# contents 才能建 release、传 assets。合在一个文件里，就得把一个只在打 tag 时才跑的能力
# 变成整个门禁的常驻权限。
#
# 触发条件是**打了 tag 之后**：workflow 文件本身要先在 main 上，tag 指向的提交认它。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # 与门禁同一个 runner：这是 Windows 应用（NSIS/MSI 打包 + WebView2），换平台没有意义
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号散在三处（package.json / tauri.conf.json / Cargo.toml），而安装包的文件名取自
      # tauri.conf.json、release 的 tag 取自这次 push、应用内「关于」显示的是 Cargo.toml
      # （`commands/app.rs` 的 `env!("CARGO_PKG_VERSION")`）。不一致时发出去的包与 tag 对不上号，
      # 而 release 一旦公开就难收回（下载链接可能已经被转发）。
      # **只校验一处是最难发现的子集**：漏改 Cargo.toml 时 tag 与安装包名都对、发布顺利，
      # 只有关于页显示旧版本。所以三处都比对（都与 tag 比，等价于三处互等）。
      - name: 校验 tag 与三处版本号一致
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # Cargo.toml 里行首的 `version = ` 只有 [package] 那一处（依赖用的是内联 table）
          CARGO=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' src-tauri/Cargo.toml | head -n 1)

          fail=0
          for entry in "package.json=$PKG" "src-tauri/tauri.conf.json=$CONF" "src-tauri/Cargo.toml=$CARGO"; do
            file="${entry%%=*}"
            ver="${entry#*=}"
            if [ -z "$ver" ]; then
              echo "::error::$file 里没有解析出版本号"
              fail=1
            elif [ "v$ver" != "$GITHUB_REF_NAME" ]; then
              echo "::error::$file 的 version=$ver 与 tag $GITHUB_REF_NAME 不一致（应为 v$ver）"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "三处版本号一致：$PKG（tag $GITHUB_REF_NAME）"

      # 不带 version：pnpm 版本由 package.json 的 `packageManager` 字段决定（单一来源），
      # 两处都指定会被 action 拒绝（Multiple versions of pnpm specified）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # ↓ 发布路径上的门禁：与 ci.yml 逐条同款（runner 同为 windows-latest）。
      #
      # 为什么必须在这里也跑一遍：tag 可以指向**任何**提交（不保证经过 CI），而发布一旦公开
      # 就难收回。没有这几步时，前端与后端的整套测试在发布当天全是装饰——唯一的代码检查来自
      # tauri.conf.json 的 beforeBuildCommand（tsc && vite build）。
      # 改这里的命令时同步改 ci.yml，别让两处基线漂移。
      - name: 类型检查（0 错误）
        run: pnpm exec tsc --noEmit

      - name: lint（0 错误 / ≤6 告警）
        run: pnpm run lint

      - name: 前端测试
        run: pnpm test

      - name: 构建（0 警告）
        run: pnpm exec vite build

      - name: clippy（0 警告）
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: 后端单元测试
        working-directory: src-tauri
        run: cargo test --lib

      # tauri.conf.json 的 beforeBuildCommand 是 `npm run build`（tsc && vite build），
      # 会再构建一次——上面那步是显式的、失败点可归因的那份，这份是打包必需的。
      #
      # 直接发布，不建草稿。
      #
      # 想恢复"先验货再点发布"的话把 releaseDraft 改回 true——那一步是人眼能拦住产物的
      # 最后一道（文件在不在、名字对不对），发布之后就没有回头路了。当前选择是
      # "push tag 即发布"，代价是产物只经过上面这几道自动检查，没人肉过一眼。
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nexus ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          releaseBody: |
            **面向 Windows 的开发环境管理平台**：把多个项目的多个服务集中在一处启停、看日志、改配置、翻代码。

            ## 主要功能

            - **项目与服务**：多服务配置（命令、工作目录、环境变量、监听路径、启停顺序），一键启停整个项目，单个服务也能独立启停与重启；在服务面板里新建、编辑（含打开工具绑定与**服务级「工具命令」**：构建/清理等常用命令，流式输出、可超时、可停止、可排序）
            - **服务模板库**：把服务配置存成模板跨项目复用，也可以直接新建；支持**导入导出**（JSON），工具绑定按名字自动重连
            - **实时日志**：虚拟滚动，每个服务保留最新 2000 行；暂停查看、搜索命中跳转、级别与 URL/IP/时间戳着色；崩溃或秒退的服务标记为「失败」并保留日志供查因；用 `start` 另开窗口跑的服务（Tomcat 的 `startup.bat` 等）会被**接管**并自动跟随它自己写的日志文件
            - **文件与代码**：文件树浏览与懒加载（右键删除走**系统回收站**）；系统剪贴板复制/粘贴（重名一次问清：保留两者 / 覆盖 / 跳过，并报出实际落地名）；CodeMirror 6 编辑器（20+ 语言），UTF-8 / GB18030 自动识别、按原换行与编码写回（保存不产生 git 误报变更）；内建图片预览、十六进制分页视图、jar 浏览（含嵌套 fat jar）
            - **键盘操作**（本版打通）：文件树、项目卡片、收起态窄轨都能全程用键盘——Tab 进入、↑↓ 移动、→/← 展开收起、Enter 打开文件 / 选中项目；文件树行会读出层级与展开状态
            - **文件监听 / Node 版本管理 / AI 助手**：监听变化触发重启（关闭 / 确认 / 自动三档）；内置 nvm-windows 面板（列出、切换、安装、卸载，没装 nvm 也能一键装）；内嵌 DeepSeek Harness，按项目托管会话
            - **可诊断性**（本版新增）：前端错误也写进 `~/.nexus/logs/nexus.log`（行首带 `[frontend]`），打包版没有控制台也能追因；同一个错误 60 秒内超过 5 条会被限流，并在日志里**明说**"已开始丢弃"
            - **界面**：深色主题、自定义标题栏、可拖拽面板与布局持久化、全局搜索；快捷键（Ctrl+S 保存、Ctrl+F 查找、Ctrl+Z / Ctrl+Shift+Z 撤销重做、Ctrl+W 关闭标签、Esc 关闭面板）

            ## 本版修复

            - **切项目时界面连闪**：点另一张项目卡片，右侧详情区会连闪三帧——先是上一个项目的服务、再是"暂无服务目录树"、然后整片面板变成"加载中…"。根因是"详情"没有和自己的项目 id 绑定，而加载态又把整个面板卸载了。现在切项目首帧就是正确内容（看过的项目直接命中缓存），加载态只落在真正缺数据的地方
            - **服务启动失败后点卡片会跳到日志**：失败态下卡片点击的含义被改成了"看日志"，想改配置反而要先想起右键菜单。现在点击一律打开编辑面板，日志有卡片上的「日志」按钮与右键两个入口
            - **展开着的项目卡片显示"暂无服务目录树"**：折叠过再展开、然后点别的项目，那张卡片的服务列表会被清空——一个陈旧的"待删除"标记在缓存重新写入后没有失效，切走时把刚装回来的数据删掉了
            - **Ctrl+F 在编辑器外毫无反应**：焦点在文件树 / 标签栏 / 服务面板时，这个键被拦下却什么都不接。现在它会打开当前文件的查找面板并把焦点放进输入框（README 的快捷键清单也补齐了）
            - **文件树与项目卡片键盘完全不可达**：这是打开文件的主入口，此前只能靠鼠标
            - **日志面板的「清空」与编辑面板的「放弃修改」一点就没**：前者清掉的是排查崩溃的唯一证据，后者会连带**永久清掉草稿**。现在都是两步确认，可取消
            - **弱化文字看不清**：11–13px 的次要文字对比度只有 3.6–4.1:1（低于 4.5:1 门槛），现调到 4.8:1；表单控件（输入框、搜索框、开关）补上了无障碍名
            - **「停止全部」要等很久**：逐个服务串行收尸，单个最坏等 5 秒。现在并行停止，且一轮只取一次全系统进程快照
            - **反复点开同一个 fat jar 里的类，每次都整包读盘**：jar 字节现在按"句柄复核过的真实路径 + 长度 + mtime"缓存（只缓存 ≤32MB 的单份），命中时零拷贝
            - **Nexus 被强杀时，另开窗口的服务可能残留**：进程原先在启动**之后**才纳入 Job Object，毫秒级的窗口里跑掉的进程不受管。现在改为**挂起创建 → 纳入 → 再唤醒**，窗口收为零
            - **窗口最小化时崩溃判定会停摆**：崩溃判定、游离进程认领、日志文件发现原本只由前端 3 秒轮询驱动，而最小化会让浏览器节流到 ≥1 分钟一次（症状是"时好时坏"）。现在后端有自己的 2 秒心跳
            - **AI 会话的 token 可能进日志**：dsh 写到 stderr 的内容原先逐行照抄进日志文件，若其中带会话 URL 的 `?token=`，凭据就会长期落盘。现在落盘前先过一遍脱敏
            - **数据库每次提交都 fsync**：WAL 下默认 `FULL`，改为官方推荐的 `NORMAL`（配置库，崩溃最多丢最后若干事务）

            ## 安装

            下载下面任一安装包（均为 64 位 Windows）：

            - **`…-setup.exe`** — NSIS 安装器，双击即装
            - **`…_en-US.msi`** — MSI，适合静默 / 批量部署

            **系统要求**：Windows 10 / 11。依赖系统自带的 WebView2 运行时（Win11 与较新的 Win10 已内置）。

            ## 首次使用

            1. 点「新建」建一个项目，指向你的代码目录
            2. 在项目里添加服务，填好命令行与工作目录
            3. 点服务卡片上的 ▶ 启动，右侧日志面板会实时刷新

            出问题时日志在 `~/.nexus/logs/nexus.log`（打包版没有控制台；前端错误也在同一个文件里）。

            ## 已知限制

            - 目前**只打包发布 Windows**：macOS / Linux 有对应的命令分支，但进程树清理、文件剪贴板互通等能力为 Windows 实现，未参与打包也未经测试
            - `.class` 反编译需要本机有 JRE，没有时自动回退到字节码视图
