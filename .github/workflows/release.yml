name: Release

# 发版：push 一个 v* tag → 在 windows runner 上打包 → 附到 GitHub Release（草稿）
#
# 为什么不并进 ci.yml：门禁只需要读代码（那里的"权限最小化"注释是刻意的），而发布必须写
# contents 才能建 release、传 assets。合在一个文件里，就得把一个只在打 tag 时才跑的能力
# 变成整个门禁的常驻权限。
#
# 触发条件是**打了 tag 之后**：workflow 文件本身要先在 main 上，tag 指向的提交认它。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # 与门禁同一个 runner：这是 Windows 应用（NSIS/MSI 打包 + WebView2），换平台没有意义
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号散在三处（package.json / tauri.conf.json / Cargo.toml），而安装包的文件名取自
      # tauri.conf.json、release 的 tag 取自这次 push。两者不一致时，发出去的包与 tag 对不上号，
      # 而 release 一旦公开就难收回（下载链接可能已经被转发）。先挡一道。
      - name: 校验 tag 与 tauri.conf.json 版本一致
        shell: bash
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 tauri.conf.json 的 version $V 不一致（应为 v$V）"
            exit 1
          fi

      # 不带 version：pnpm 版本由 package.json 的 `packageManager` 字段决定（单一来源），
      # 两处都指定会被 action 拒绝（Multiple versions of pnpm specified）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # 不用另跑前端构建：tauri.conf.json 的 beforeBuildCommand 是 `npm run build`（tsc && vite build）
      #
      # 直接发布，不建草稿。
      #
      # 想恢复"先验货再点发布"的话把 releaseDraft 改回 true——那一步是人眼能拦住产物的
      # 最后一道（文件在不在、名字对不对），发布之后就没有回头路了。当前选择是
      # "push tag 即发布"，代价是产物只经过 CI 的自动检查，没人肉过一眼。
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nexus ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          releaseBody: |
            **面向 Windows 的开发环境管理平台**：把多个项目的多个服务集中在一处启停、看日志、改配置、翻代码。

            ## 主要功能

            - **项目与服务**：多服务配置（命令、工作目录、环境变量、监听路径、启停顺序），一键启停整个项目，单个服务也能独立启停与重启；直接在服务面板里新建、编辑（含打开工具绑定），添加服务不再是"先填三个字段再开一次面板"
            - **服务模板库**：把服务配置存成模板跨项目复用，也可以在模板库里**直接新建**；支持**导入导出**（JSON），换机器或分享给同事时工具绑定按名字自动重连
            - **实时日志**：虚拟滚动，每个服务保留最新 2000 行；暂停查看、搜索命中跳转、级别与 URL/IP/时间戳着色；崩溃或秒退的服务标记为「失败」并保留日志供查因
            - **文件与代码**：文件树浏览与懒加载；CodeMirror 6 编辑器（20+ 语言），UTF-8 / GB18030 自动识别，按原换行与编码写回（保存不产生 git 误报变更）；内建图片预览、十六进制分页视图、jar 浏览（含嵌套 fat jar）
            - **Markdown 预览**：标签栏一键在源码与渲染结果之间切换（只读预览，不改动文件）
            - **文件监听**：监听路径变化触发服务重启，关闭 / 确认 / 自动三档，带 2 秒冷却去抖，可排除 node_modules、.git、dist
            - **Node 版本管理**：内置 nvm-windows 面板——列出已装版本、一键切换全局 node（所有终端跟着变）、按需安装 / 卸载；**卸载正在使用的版本会被拦下**并提示先切换到别的版本
            - **AI 助手**：内嵌 DeepSeek Harness，按项目托管会话，工作目录即当前项目
            - **界面**：深色主题、自定义标题栏（左上角应用菜单：版本 / 关于 / 检查更新）、可拖拽面板与布局持久化、全局搜索、常用快捷键

            ## 安装

            下载下面任一安装包（均为 64 位 Windows）：

            - **`…-setup.exe`** — NSIS 安装器，双击即装
            - **`…_en-US.msi`** — MSI，适合静默 / 批量部署

            **系统要求**：Windows 10 / 11。依赖系统自带的 WebView2 运行时（Win11 与较新的 Win10 已内置）。

            ## 首次使用

            1. 点「新建」建一个项目，指向你的代码目录
            2. 在项目里添加服务，填好命令行与工作目录
            3. 点服务卡片上的 ▶ 启动，右侧日志面板会实时刷新

            出问题时日志在 `~/.nexus/logs/nexus.log`（打包版没有控制台）。

            ## 已知限制

            - 目前**只打包发布 Windows**：macOS / Linux 有对应的命令分支，但进程树清理、文件剪贴板互通等能力为 Windows 实现，未参与打包也未经测试
            - `.class` 反编译需要本机有 JRE，没有时自动回退到字节码视图
