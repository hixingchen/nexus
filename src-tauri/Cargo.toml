[workspace]
# 启动器是独立 crate（不能在主 package 里加第二个 bin，否则 Tauri 的 MSI
# bundler 会把同一个 externalBin 当成两个组件，报 ICE30）。
members = ["boot-runner"]

[package]
name = "nexus"
version = "1.10.0"
description = "Nexus - Development Environment Manager"
authors = ["Nexus Team"]
edition = "2021"

[lib]
name = "nexus_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# zstd-safe 只有 >=8.2.0 修掉了 2026-10-16 的一批内存安全 advisory；0.13 依赖的
# zstd-safe 7.x 没有修复版本，因此必须升到 zstd 0.14（对应 zstd-safe 8.2）
zstd = "0.14"
# SHA-256（SEC-20：nvm 安装器下载后与执行前各校验一次）。树里本来就有它
# （tauri-codegen 与 wry 都依赖 sha2），这里只是把传递依赖提成直接依赖，
# 不新增任何需要下载/审计的包——比手写一份 SHA-256 更不容易出错
sha2 = "0.10"
tauri = { version = "2.0", features = ["unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 只声明实际用到的 feature：fs（tokio::fs）/ time（超时）/ process（java 反编译）/ io-util（AsyncRead/Seek）
# / rt-multi-thread（spawn_blocking 的运行时）。此前多列了 sync 与 macros，两者在 src 中零引用。
tokio = { version = "1.0", features = ["rt-multi-thread", "fs", "time", "process", "io-util"] }
log = "0.4"
env_logger = "~0.11"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "~0.31", features = ["bundled"] }
dirs = "~5.0"
notify = "~6.1"
uuid = { version = "1.0", features = ["v4"] }
encoding_rs = "0.8"
base64 = "0.22"
# 2.x 有 3 条 extract() 相关的提权 advisory（RUSTSEC-2026-0367/0368/0369），
# 修复只存在于 >= 9.0.0；9.x 同时把 zstd 依赖升到 0.14（zstd-safe 8.2）
zip = "9"
# 回收站删除（文件树右键「删除」）。走系统 shell 的 IFileOperation 而不是自己实现：
# 长路径、权限、跨卷、联接点都归它处理。默认 feature 必需——coinit_apartmentthreaded
# 负责在调用线程初始化 COM（我们在 spawn_blocking 的工作线程里调它）。
trash = "5.2"

[target."cfg(windows)".dependencies]
# 5.4.1 已被 yanked（cargo audit 报 yanked）；5.4.3 是当前非 yanked 的 5.x 版本
clipboard-win = "5.4.3"
# 读注册表里的持久化环境变量（NVM_HOME / NVM_SYMLINK 的兜底，见 commands/node.rs 的
# persistent_env）。只用到注册表读取，不引 winreg——那个 crate 已在依赖图里，
# 但它是 tauri 的构建期依赖，用普通依赖引入等于往运行时二进制里多塞一个包
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry"] }
