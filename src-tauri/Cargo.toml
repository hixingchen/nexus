[package]
name = "nexus"
version = "1.0.0"
description = "Nexus - Development Environment Manager"
authors = ["Nexus Team"]
edition = "2021"

[lib]
name = "nexus_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
zstd = "0.13"
tauri = { version = "2.0", features = ["unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 只声明实际用到的 feature：fs（tokio::fs）/ time（超时）/ process（java 反编译）/ io-util（AsyncRead/Seek）
# / rt-multi-thread（spawn_blocking 的运行时）。此前多列了 sync 与 macros，两者在 src 中零引用。
tokio = { version = "1.0", features = ["rt-multi-thread", "fs", "time", "process", "io-util"] }
log = "0.4"
env_logger = "~0.11"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "~0.31", features = ["bundled"] }
dirs = "~5.0"
notify = "~6.1"
uuid = { version = "1.0", features = ["v4"] }
encoding_rs = "0.8"
base64 = "0.22"
zip = "2"

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.1"
