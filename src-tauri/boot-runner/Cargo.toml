[package]
name = "nexus-boot-runner"
version = "2.6.0"
edition = "2021"
description = "Nexus 登录前服务启动器（独立 exe）"
publish = false

[[bin]]
name = "nexus-boot-runner"
path = "src/main.rs"

[dependencies]
# 复用 boot-core 的 runner 主循环，不复制业务逻辑；
# 独立 crate 是为了让 Tauri 的 MSI bundler 不会把同一个 sidecar 当成两个组件。
# 直接依赖 boot-core（而不是 nexus lib）让它不再链接 Tauri/WebView2。
boot-core = { path = "../boot-core" }

[build-dependencies]
# tauri-build 已经在依赖图里，复用它嵌入图标不会新增下载包
tauri-winres = "0.3"
